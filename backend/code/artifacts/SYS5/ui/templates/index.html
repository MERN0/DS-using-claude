<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SYS5 Client Setup</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <nav class="navbar navbar-expand navbar-light bg-white border-bottom sticky-top">
    <div class="container-fluid justify-content-center">
      <span class="navbar-brand mb-0 fw-semibold">SYS5 Client Setup</span>
      <span class="text-muted small ms-2 d-none d-sm-inline">customize the test-case pipeline for a project</span>
    </div>
  </nav>

  <main class="container py-3" style="max-width: 760px;">
    <div id="chat" class="d-flex flex-column gap-3 pb-5" aria-live="polite"></div>
  </main>

  <footer class="fixed-bottom bg-white border-top">
    <div class="container py-2" style="max-width: 760px;">
      <form id="composer" class="d-flex flex-column gap-2">
        <textarea
          id="textInput"
          class="form-control d-none"
          rows="1"
          placeholder=""
          aria-label="Your reply"></textarea>
        <div class="d-flex gap-2">
          <button type="submit" id="sendBtn" class="btn btn-primary ms-auto d-none">Send</button>
        </div>
      </form>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="{{ url_for('static', path='chat.js') }}"></script>
</body>
</html>
